name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure XFYUN wake credentials
        shell: pwsh
        env:
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XFYUN_APP_ID) -or
              [string]::IsNullOrWhiteSpace($env:XFYUN_API_KEY) -or
              [string]::IsNullOrWhiteSpace($env:XFYUN_API_SECRET)) {
            Write-Host 'XFYUN secrets are not configured; packaging will include the example config.'
            exit 0
          }
          $configPath = 'electron/native/xfyun-awake/runtime/xfyun-awake.ini'
          @"
          [xfyun]
          app_id=$env:XFYUN_APP_ID
          api_key=$env:XFYUN_API_KEY
          api_secret=$env:XFYUN_API_SECRET

          [wake]
          threshold=0
          "@ | Set-Content -Path $configPath -Encoding utf8

      - name: Build XFYUN Windows wake helper
        shell: pwsh
        run: .\electron\native\xfyun-awake\build.ps1 -Configuration Release -Platform x64

      - name: Build renderer
        run: pnpm build:desktop

      - name: Prepare Electron staging directory
        run: pnpm desktop:prepare

      - name: Package Windows NSIS x64
        run: pnpm exec electron-builder --config electron-builder.yml --win nsis --x64

      - name: Verify packaged XFYUN config
        shell: pwsh
        run: |
          $configPath = 'release/desktop/win-unpacked/resources/xfyun-awake/xfyun-awake.ini'
          if (!(Test-Path $configPath)) {
            throw "Packaged XFYUN config was not found: $configPath"
          }
          $config = Get-Content -Raw -Path $configPath
          foreach ($key in @('app_id', 'api_key', 'api_secret')) {
            if ($config -notmatch "(?mi)^\s*$key\s*=\s*\S") {
              throw "Packaged XFYUN config is missing $key"
            }
          }
          Write-Host 'Packaged XFYUN config contains app_id, api_key and api_secret.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: release/desktop/*
          if-no-files-found: error
          retention-days: 14

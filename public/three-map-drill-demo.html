<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 地图下钻 Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020816;
        font-family:
          Inter,
          "PingFang SC",
          "Microsoft YaHei",
          Arial,
          sans-serif;
        color: #dff8ff;
      }

      #app {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(24, 180, 235, 0.16), rgba(2, 8, 22, 0) 36%),
          radial-gradient(circle at 16% 12%, rgba(90, 211, 255, 0.12), rgba(2, 8, 22, 0) 28%),
          linear-gradient(180deg, #031329 0%, #020816 55%, #01040d 100%);
      }

      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .hud {
        position: absolute;
        left: 28px;
        top: 24px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 14px;
        pointer-events: none;
      }

      .title {
        min-width: 260px;
        padding: 12px 18px;
        border: 1px solid rgba(72, 226, 255, 0.34);
        background:
          linear-gradient(90deg, rgba(8, 44, 82, 0.82), rgba(4, 18, 42, 0.48)),
          rgba(3, 15, 34, 0.64);
        box-shadow:
          inset 0 0 24px rgba(52, 211, 255, 0.08),
          0 0 28px rgba(0, 183, 255, 0.12);
      }

      .title strong {
        display: block;
        font-size: 18px;
        line-height: 26px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .title span {
        display: block;
        margin-top: 2px;
        color: rgba(170, 215, 238, 0.78);
        font-size: 12px;
      }

      .back-button {
        pointer-events: auto;
        height: 40px;
        padding: 0 16px;
        border: 1px solid rgba(88, 228, 255, 0.46);
        background:
          linear-gradient(180deg, rgba(20, 86, 128, 0.72), rgba(6, 31, 58, 0.7)),
          rgba(5, 24, 48, 0.82);
        color: #e8fcff;
        cursor: pointer;
        font-size: 13px;
        box-shadow: 0 0 20px rgba(37, 211, 255, 0.16);
      }

      .back-button:disabled {
        opacity: 0.42;
        cursor: default;
      }

      .side-panel {
        position: absolute;
        right: 28px;
        top: 24px;
        z-index: 10;
        width: 272px;
        padding: 16px;
        border: 1px solid rgba(72, 226, 255, 0.28);
        background:
          linear-gradient(180deg, rgba(4, 26, 54, 0.86), rgba(2, 11, 28, 0.62)),
          rgba(2, 8, 22, 0.72);
        box-shadow:
          inset 0 0 28px rgba(49, 209, 255, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.34);
      }

      .side-panel h2 {
        margin: 0 0 12px;
        color: #e6fbff;
        font-size: 15px;
        font-weight: 600;
      }

      .metric {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: 12px;
        padding: 9px 0;
        border-bottom: 1px solid rgba(120, 215, 255, 0.12);
      }

      .metric:last-child {
        border-bottom: 0;
      }

      .metric span {
        color: rgba(183, 219, 238, 0.72);
        font-size: 12px;
      }

      .metric strong {
        color: #54e8ff;
        font-size: 20px;
        font-family: "DIN Alternate", Arial, sans-serif;
      }

      .hint {
        position: absolute;
        left: 28px;
        bottom: 24px;
        z-index: 10;
        color: rgba(180, 220, 238, 0.68);
        font-size: 12px;
        line-height: 20px;
      }

      .label-layer {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .map-label {
        position: absolute;
        color: rgba(238, 253, 255, 0.92);
        font-size: 12px;
        font-weight: 600;
        text-shadow:
          0 0 8px rgba(33, 211, 255, 0.88),
          0 1px 3px rgba(0, 0, 0, 0.86);
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }

      .tooltip {
        position: absolute;
        z-index: 20;
        min-width: 144px;
        padding: 10px 12px;
        border: 1px solid rgba(91, 235, 255, 0.56);
        background:
          linear-gradient(135deg, rgba(10, 69, 96, 0.92), rgba(3, 24, 52, 0.9)),
          rgba(3, 24, 52, 0.86);
        box-shadow:
          inset 0 0 20px rgba(72, 226, 255, 0.12),
          0 0 28px rgba(47, 222, 255, 0.18);
        color: #effcff;
        pointer-events: none;
        transform: translate(18px, -50%);
        opacity: 0;
        transition: opacity 0.12s ease;
      }

      .tooltip.visible {
        opacity: 1;
      }

      .tooltip b {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .tooltip span {
        color: rgba(194, 229, 242, 0.78);
        font-size: 12px;
      }

      .loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background: rgba(2, 8, 22, 0.72);
        color: #acecff;
        font-size: 14px;
        letter-spacing: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.14s ease;
      }

      .loading.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="labels" class="label-layer"></div>
      <div class="hud">
        <div class="title">
          <strong id="regionTitle">全国地图</strong>
          <span id="regionSubtitle">Three.js 单层渲染，点击省份下钻</span>
        </div>
        <button id="backButton" class="back-button" type="button" disabled>返回全国</button>
      </div>
      <aside class="side-panel">
        <h2>当前层级</h2>
        <div class="metric">
          <span>区域数量</span>
          <strong id="regionCount">0</strong>
        </div>
        <div class="metric">
          <span>渲染三角面</span>
          <strong id="triangleCount">0</strong>
        </div>
        <div class="metric">
          <span>鼠标悬停</span>
          <strong id="hoverName">--</strong>
        </div>
      </aside>
      <div class="hint">
        鼠标悬停高亮区域，点击有 geoId 的区域下钻。当前 demo 只渲染当前层级，适合省/市/县有限数据范围。
      </div>
      <div id="tooltip" class="tooltip"></div>
      <div id="loading" class="loading">地图加载中...</div>
    </div>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
      import { geoMercator, geoBounds } from "https://cdn.jsdelivr.net/npm/d3-geo@3/+esm";
      import earcut from "https://cdn.jsdelivr.net/npm/earcut@2/+esm";

      const CHINA_GEO_URL = "/assets/data/map/geo/china-lite-safe.json";
      const DETAIL_GEO_BASE_URL =
        location.hostname === "localhost" || location.hostname === "127.0.0.1"
          ? "/__geo_proxy/assets/data/map/geo"
          : "http://101.42.184.189:555/assets/data/map/geo";

      const HOME = {
        title: "全国地图",
        subtitle: "Three.js 单层渲染，点击省份下钻",
        geoId: ""
      };

      const canvas = document.getElementById("canvas");
      const labelsEl = document.getElementById("labels");
      const tooltipEl = document.getElementById("tooltip");
      const loadingEl = document.getElementById("loading");
      const backButton = document.getElementById("backButton");
      const regionTitle = document.getElementById("regionTitle");
      const regionSubtitle = document.getElementById("regionSubtitle");
      const regionCount = document.getElementById("regionCount");
      const triangleCount = document.getElementById("triangleCount");
      const hoverName = document.getElementById("hoverName");

      let renderer;
      try {
        const webglContext =
          canvas.getContext("webgl2", {
            antialias: true,
            alpha: true,
            powerPreference: "high-performance",
            failIfMajorPerformanceCaveat: false
          }) ||
          canvas.getContext("webgl", {
            antialias: true,
            alpha: true,
            powerPreference: "high-performance",
            failIfMajorPerformanceCaveat: false
          });

        if (!webglContext) {
          throw new Error("当前浏览器无法创建 WebGL 上下文");
        }

        renderer = new THREE.WebGLRenderer({
          canvas,
          context: webglContext,
          antialias: true,
          alpha: true
        });
      } catch (error) {
        loadingEl.textContent = `${error.message}，请用支持 WebGL 的 Chrome 打开`;
        loadingEl.classList.add("visible");
        throw error;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
      camera.position.set(0, 0, 180);
      camera.lookAt(0, 0, 0);

      const mapGroup = new THREE.Group();
      const glowGroup = new THREE.Group();
      const lineGroup = new THREE.Group();
      scene.add(glowGroup, mapGroup, lineGroup);

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const clock = new THREE.Clock();
      const geoCache = new Map();
      let currentGeo = null;
      let hovered = null;
      let currentLevel = HOME;
      let frameId = 0;
      let totalTriangles = 0;
      let labelItems = [];

      const decodeFeature = (feature) => {
        const geometry = feature.geometry;
        if (!geometry || !geometry.encodeOffsets) return feature;

        const scale = 1024;
        const { type, coordinates, encodeOffsets } = geometry;

        const decodePart = (coordinate, encodeOffset) => {
          const result = [];
          let prevX = encodeOffset[0];
          let prevY = encodeOffset[1];
          for (let i = 0; i < coordinate.length; i += 2) {
            let x = coordinate.charCodeAt(i) - 64;
            let y = coordinate.charCodeAt(i + 1) - 64;
            x = x & 1 ? ~(x >> 1) : x >> 1;
            y = y & 1 ? ~(y >> 1) : y >> 1;
            x += prevX;
            y += prevY;
            prevX = x;
            prevY = y;
            result.push([x / scale, y / scale]);
          }
          return result;
        };

        if (type === "Polygon") {
          geometry.coordinates = coordinates.map((c, i) => decodePart(c, encodeOffsets[i]));
        } else if (type === "MultiPolygon") {
          geometry.coordinates = coordinates.map((polygons, i) =>
            polygons.map((c, j) => decodePart(c, encodeOffsets[i][j]))
          );
        }
        delete geometry.encodeOffsets;
        return feature;
      };

      const cloneAndDecodeGeo = (geo) => {
        const nextGeo = structuredClone(geo);
        nextGeo.features?.forEach(decodeFeature);
        return nextGeo;
      };

      const loadGeo = async (url) => {
        if (geoCache.has(url)) return cloneAndDecodeGeo(geoCache.get(url));
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`GeoJSON 加载失败：${response.status} ${url}`);
        }
        const geo = await response.json();
        geoCache.set(url, geo);
        return cloneAndDecodeGeo(geo);
      };

      const setLoading = (visible) => {
        loadingEl.classList.toggle("visible", visible);
      };

      const normalizeName = (name) =>
        String(name || "").replace(/省|市|壮族自治区|回族自治区|维吾尔自治区|自治区|特别行政区/g, "");

      const getPolygons = (feature) => {
        const { type, coordinates } = feature.geometry || {};
        if (type === "Polygon") return [coordinates];
        if (type === "MultiPolygon") return coordinates;
        return [];
      };

      const createProjection = (geo) => {
        const bounds = geoBounds(geo);
        const center = [
          (bounds[0][0] + bounds[1][0]) / 2,
          (bounds[0][1] + bounds[1][1]) / 2
        ];
        return geoMercator().center(center).scale(1).translate([0, 0]);
      };

      const projectRing = (ring, projection, scale) =>
        ring
          .map((coord) => projection(coord))
          .filter((point) => point && Number.isFinite(point[0]) && Number.isFinite(point[1]))
          .map(([x, y]) => [x * scale, -y * scale]);

      const buildPolygonGeometry = (polygon, projection, scale) => {
        const vertices = [];
        const holes = [];
        const rings = [];

        polygon.forEach((ring, ringIndex) => {
          const projected = projectRing(ring, projection, scale);
          if (projected.length < 3) return;
          if (ringIndex > 0) holes.push(vertices.length / 2);
          projected.forEach(([x, y]) => {
            vertices.push(x, y);
          });
          rings.push(projected);
        });

        if (vertices.length < 6) return null;
        const indices = earcut(vertices, holes, 2);
        const position = [];
        indices.forEach((index) => {
          position.push(vertices[index * 2], vertices[index * 2 + 1], 0);
        });

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(position, 3));
        geometry.computeVertexNormals();
        return {
          geometry,
          rings,
          triangles: indices.length / 3
        };
      };

      const createRegionMaterial = (feature, index) => {
        const value = getRegionValue(feature, index);
        const hue = 0.52 + Math.min(value / 900, 1) * 0.08;
        const color = new THREE.Color().setHSL(hue, 0.88, 0.34 + Math.min(value / 1200, 1) * 0.18);
        return new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.78,
          depthWrite: false,
          side: THREE.DoubleSide
        });
      };

      const createGlowMaterial = () =>
        new THREE.MeshBasicMaterial({
          color: 0x29e4ff,
          transparent: true,
          opacity: 0.12,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });

      const createLineMaterial = (active = false) =>
        new THREE.LineBasicMaterial({
          color: active ? 0xf5feff : 0x65f1ff,
          transparent: true,
          opacity: active ? 0.96 : 0.66,
          blending: THREE.AdditiveBlending
        });

      const getRegionValue = (feature, index) => {
        const seed = Number(String(feature.id || index).slice(-4)) || index * 97;
        return Math.round(80 + ((seed * 37) % 850));
      };

      const addOutline = (rings, z, material, targetGroup) => {
        rings.forEach((ring) => {
          if (ring.length < 2) return;
          const points = ring.map(([x, y]) => new THREE.Vector3(x, y, z));
          points.push(points[0].clone());
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const line = new THREE.Line(geometry, material);
          targetGroup.add(line);
        });
      };

      const disposeObject = (object) => {
        object.traverse?.((child) => {
          child.geometry?.dispose?.();
          if (Array.isArray(child.material)) {
            child.material.forEach((material) => material.dispose?.());
          } else {
            child.material?.dispose?.();
          }
        });
      };

      const clearGroup = (group) => {
        while (group.children.length) {
          const child = group.children.pop();
          disposeObject(child);
        }
      };

      const clearLabels = () => {
        labelItems = [];
        labelsEl.innerHTML = "";
      };

      const addLabel = (feature, projection, scale) => {
        const cp = feature.properties?.cp;
        const name = feature.properties?.name;
        if (!cp || !name) return;
        const point = projection(cp);
        if (!point) return;
        const el = document.createElement("div");
        el.className = "map-label";
        el.textContent = normalizeName(name);
        labelsEl.appendChild(el);
        labelItems.push({
          el,
          position: new THREE.Vector3(point[0] * scale, -point[1] * scale, 4)
        });
      };

      const updateLabels = () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        labelItems.forEach((item) => {
          const projected = item.position.clone().project(camera);
          item.el.style.left = `${(projected.x * 0.5 + 0.5) * width}px`;
          item.el.style.top = `${(-projected.y * 0.5 + 0.5) * height}px`;
          item.el.style.display = projected.z > 1 ? "none" : "block";
        });
      };

      const fitCameraToGeo = (geo, projection, scale) => {
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;

        geo.features.forEach((feature) => {
          getPolygons(feature).forEach((polygon) => {
            polygon.forEach((ring) => {
              projectRing(ring, projection, scale).forEach(([x, y]) => {
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
              });
            });
          });
        });

        const geoWidth = Math.max(maxX - minX, 1);
        const geoHeight = Math.max(maxY - minY, 1);
        const aspect = window.innerWidth / window.innerHeight;
        const padding = 1.2;
        const viewHeight = Math.max(geoHeight * padding, (geoWidth * padding) / aspect);
        const viewWidth = viewHeight * aspect;
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;

        camera.left = centerX - viewWidth / 2;
        camera.right = centerX + viewWidth / 2;
        camera.top = centerY + viewHeight / 2;
        camera.bottom = centerY - viewHeight / 2;
        camera.updateProjectionMatrix();
      };

      const renderGeo = (geo, level) => {
        clearGroup(mapGroup);
        clearGroup(glowGroup);
        clearGroup(lineGroup);
        clearLabels();
        currentGeo = geo;
        currentLevel = level;
        totalTriangles = 0;

        const projection = createProjection(geo);
        const scale = 120;
        fitCameraToGeo(geo, projection, scale);

        geo.features.forEach((feature, featureIndex) => {
          const region = new THREE.Group();
          region.userData.feature = feature;
          region.userData.value = getRegionValue(feature, featureIndex);
          const regionMaterial = createRegionMaterial(feature, featureIndex);
          const glowMaterial = createGlowMaterial();
          const lineMaterial = createLineMaterial(false);

          getPolygons(feature).forEach((polygon) => {
            const built = buildPolygonGeometry(polygon, projection, scale);
            if (!built) return;
            totalTriangles += built.triangles;

            const mesh = new THREE.Mesh(built.geometry, regionMaterial);
            mesh.userData.region = region;
            mesh.userData.feature = feature;
            region.add(mesh);

            const glowMesh = new THREE.Mesh(built.geometry.clone(), glowMaterial);
            glowMesh.position.z = -2;
            glowMesh.scale.set(1.012, 1.012, 1);
            glowGroup.add(glowMesh);

            addOutline(built.rings, 3, lineMaterial, region);
            addOutline(built.rings, -1, createLineMaterial(false), lineGroup);
          });

          mapGroup.add(region);
          addLabel(feature, projection, scale);
        });

        regionTitle.textContent = level.title;
        regionSubtitle.textContent = level.subtitle;
        regionCount.textContent = String(geo.features.length);
        triangleCount.textContent = String(Math.round(totalTriangles));
        backButton.disabled = !level.geoId;
        hoverName.textContent = "--";
      };

      const getIntersectedRegion = (event) => {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const meshes = [];
        mapGroup.children.forEach((region) => {
          region.children.forEach((child) => {
            if (child.isMesh) meshes.push(child);
          });
        });
        const hits = raycaster.intersectObjects(meshes, false);
        return hits[0]?.object?.userData?.region || null;
      };

      const setHovered = (region) => {
        if (hovered === region) return;
        if (hovered) {
          hovered.scale.set(1, 1, 1);
          hovered.children.forEach((child) => {
            if (child.isMesh) child.material.opacity = 0.78;
            if (child.isLine) {
              child.material.dispose?.();
              child.material = createLineMaterial(false);
            }
          });
        }
        hovered = region;
        if (!hovered) {
          hoverName.textContent = "--";
          tooltipEl.classList.remove("visible");
          return;
        }
        hovered.scale.set(1.015, 1.015, 1);
        hovered.children.forEach((child) => {
          if (child.isMesh) child.material.opacity = 0.96;
          if (child.isLine) {
            child.material.dispose?.();
            child.material = createLineMaterial(true);
          }
        });
        const feature = hovered.userData.feature;
        hoverName.textContent = normalizeName(feature.properties?.name);
      };

      const showTooltip = (event, region) => {
        if (!region) {
          tooltipEl.classList.remove("visible");
          return;
        }
        const feature = region.userData.feature;
        const value = region.userData.value;
        tooltipEl.innerHTML = `<b>${feature.properties?.name || "--"}</b><span>模拟数据：${value} 项次<br>geoId：${feature.id || "--"}</span>`;
        tooltipEl.style.left = `${event.clientX}px`;
        tooltipEl.style.top = `${event.clientY}px`;
        tooltipEl.classList.add("visible");
      };

      const drillToFeature = async (feature) => {
        const geoId = String(feature?.id || feature?.properties?.geoId || "").trim();
        if (!geoId) return;
        setLoading(true);
        try {
          const geo = await loadGeo(`${DETAIL_GEO_BASE_URL}/${geoId}.json`);
          renderGeo(geo, {
            title: `${feature.properties?.name || "区域"}地图`,
            subtitle: "当前只渲染该区域下级行政边界",
            geoId
          });
        } catch (error) {
          console.error(error);
          alert(`下钻失败：${error.message}`);
        } finally {
          setLoading(false);
        }
      };

      const goHome = async () => {
        setLoading(true);
        try {
          const geo = await loadGeo(CHINA_GEO_URL);
          renderGeo(geo, HOME);
        } finally {
          setLoading(false);
        }
      };

      canvas.addEventListener("mousemove", (event) => {
        const region = getIntersectedRegion(event);
        setHovered(region);
        showTooltip(event, region);
      });

      canvas.addEventListener("mouseleave", () => {
        setHovered(null);
      });

      canvas.addEventListener("click", () => {
        if (hovered) void drillToFeature(hovered.userData.feature);
      });

      backButton.addEventListener("click", () => {
        void goHome();
      });

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (currentGeo) {
          const projection = createProjection(currentGeo);
          fitCameraToGeo(currentGeo, projection, 120);
        }
        updateLabels();
      });

      const animate = () => {
        frameId = requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();
        glowGroup.position.z = Math.sin(elapsed * 1.2) * 0.6;
        glowGroup.children.forEach((child, index) => {
          child.material.opacity = 0.08 + Math.sin(elapsed * 1.6 + index * 0.08) * 0.025;
        });
        renderer.render(scene, camera);
        updateLabels();
      };

      setLoading(true);
      goHome()
        .then(() => {
          animate();
        })
        .catch((error) => {
          console.error(error);
          alert(`初始化失败：${error.message}`);
        })
        .finally(() => {
          setLoading(false);
        });

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(frameId);
        clearGroup(mapGroup);
        clearGroup(glowGroup);
        clearGroup(lineGroup);
        renderer.dispose();
      });
    </script>
  </body>
</html>
